name: 部署文档

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 设置 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: 设置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: |
          corepack enable
          pnpm ci

      - name: 构建文档
        env:
          # ✅ 修复1: 统一使用 8192，删除冲突的 4096
          # ✅ 修复2: 使用连字符格式 max-old-space-size（下划线格式在某些 Node 版本中不生效）
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          pnpm run docs:build
          touch src/.vuepress/dist/.nojekyll

      - name: 部署文档
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: src/.vuepress/dist
